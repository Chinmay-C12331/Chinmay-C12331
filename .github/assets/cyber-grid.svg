<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Original neon civic technology grid</title>
  <desc id="desc">A dark 3D perspective grid with cyan and magenta light, created for a GitHub profile README.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080b18"/>
      <stop offset="0.52" stop-color="#11102b"/>
      <stop offset="1" stop-color="#260b27"/>
    </linearGradient>

    <radialGradient id="sun" cx="50%" cy="40%" r="40%">
      <stop stop-color="#ff4fb3" stop-opacity=".9"/>
      <stop offset=".42" stop-color="#ff007f" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ff007f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#14143a"/>
      <stop offset="1" stop-color="#05060d"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#sky)"/>

  <circle cx="800" cy="190" r="270" fill="url(#sun)"/>

  <path d="M0 330 Q800 250 1600 330 V520 H0Z" fill="url(#floor)"/>

  <g stroke="#00f0ff" stroke-opacity=".42" fill="none" filter="url(#glow)">
    <path d="M0 365 Q800 305 1600 365"/>
    <path d="M0 410 Q800 365 1600 410"/>
    <path d="M0 462 Q800 435 1600 462"/>
    <path d="M0 510 Q800 505 1600 510"/>

    <path d="M800 300 L800 520"/>
    <path d="M650 310 L540 520"/>
    <path d="M950 310 L1060 520"/>
    <path d="M470 325 L270 520"/>
    <path d="M1130 325 L1330 520"/>
    <path d="M250 345 L0 520"/>
    <path d="M1350 345 L1600 520"/>
  </g>

  <g fill="none" stroke="#ff007f" stroke-opacity=".6">
    <circle cx="800" cy="188" r="78"/>
    <circle cx="800" cy="188" r="102"/>
  </g>

  <g fill="#00f0ff" filter="url(#glow)">
    <circle cx="190" cy="92" r="2"/>
    <circle cx="1370" cy="116" r="2"/>
    <circle cx="1220" cy="64" r="1.5"/>
    <circle cx="390" cy="136" r="1.5"/>
  </g>

  <path
    d="M0 330 Q800 250 1600 330"
    stroke="#ff007f"
    stroke-width="2"
    fill="none"
    filter="url(#glow)"
  />
</svg>
